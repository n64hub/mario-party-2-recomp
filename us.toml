# The opening theater's spotlights past 4:3: func_80103BF0_3D6110_TitleScreenAndIntro(gfx, in s1) dims the stage round
# the characters in the spotlight with a mask the CPU draws the spotlights into (255 where it is dimmed), in 32x32
# pieces stretched over 0 to 320 under a 4:3 scissor, in the colour at D_80112060 with that colour's alpha times the
# mask's. So nothing dimmed the stage past 4:3, which stayed bright with a seam at 4:3's edges. Its colour and combine
# are set at 0x80103E14: there the sides past 4:3 (mp_wipe_sides) are drawn in that colour and alpha, as the mask is
# where it is 255, and the game's combine is put back for its pieces.
[[patches.hook]]
func = "func_80103BF0_3D6110_TitleScreenAndIntro"
before_vram = 0x80103E14
text = "{ void mp_wipe_sides(uint8_t*, gpr); gpr g = MEM_W(0, ctx->r17); MEM_W(0, g) = (int32_t)0xFCFFFFFF; MEM_W(4, g) = (int32_t)0xFFFDF6FB; MEM_W(0, ctx->r17) = (int32_t)(g + 8); mp_wipe_sides(rdram, ctx->r17); g = MEM_W(0, ctx->r17); MEM_W(0, g) = (int32_t)0xFCFFB3FF; MEM_W(4, g) = (int32_t)0xFF65FEFF; MEM_W(0, ctx->r17) = (int32_t)(g + 8); }"

# A 4:3 picture's sides black (lib/mario-party-engine/src/wipe.cpp, mp_wipe_picture_sides): func_800286FC_292FC ends
# the frame's last display list after its wipe and its text, the list's next command in v0, with its gDPFullSync.
[[patches.hook]]
func = "func_800286FC_292FC"
before_vram = 0x800292CC
text = "{ gpr mp_wipe_picture_sides(uint8_t*, gpr); ctx->r2 = mp_wipe_picture_sides(rdram, ctx->r2); }"

# A scene drawn at the game's own rate (patches/frame_rate.c, frame_rate_task): func_8001D054_1DC54 sends each task to
# the graphics thread, its display list ended. The game's registers are kept around the call.
[[patches.hook]]
func = "func_8001D054_1DC54"
before_vram = 0x8001D054
text = "{ void frame_rate_task(uint8_t*, recomp_context*); recomp_context saved = *ctx; frame_rate_task(rdram, ctx); *ctx = saved; }"

# And the list the scheduler sends after each frame's last task (patches/frame_rate.c, frame_rate_list):
# func_8007C254_7CE54 before it ends the list with gDPFullSync, the list's next command at a1. The game's registers are
# kept around the call, a1 moved past what it writes.
[[patches.hook]]
func = "func_8007C254_7CE54"
before_vram = 0x8007C320
text = "{ void frame_rate_list(uint8_t*, recomp_context*); recomp_context saved = *ctx; gpr next; ctx->r4 = ctx->r5; frame_rate_list(rdram, ctx); next = ctx->r2; *ctx = saved; ctx->r5 = next; }"

