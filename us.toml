# N64Recomp's configuration for Mario Party 2 (USA), SHA-1 166eda1c05670d337e2c3f15a5db528ae1e5d6e3: it reads the game's
# code out of the ROM by the symbols tools/gen_syms.sh dumps from the decomp's ELF, and writes RecompiledFuncs/
# (tools/recompile.sh). The code is stored raw in the ROM: main after the boot code, and each of the 115 overlays
# (minigames, boards, menus) where marioparty2.yaml has it, so there is nothing to decompress first.
[input]
# The decomp's entrypoint (asm/entrypoint.s), the ROM header's.
entrypoint = 0x80000400
# Paths are relative to this file.
symbols_file_path = "syms/marioparty2.us.syms.toml"
rom_file_path = "roms/marioparty2.us.z64"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true

[patches]
# Functions recompiled as empty ones.
stubs = [
    # libleo's boot of a 64DD disk game, which the game links in and reaches only with a 64DD attached, which the
    # runtime never reports: the first writes to its stack at an offset N64Recomp can't analyze, the second sets
    # cop0's TagLo to clear the caches.
    "__LeoBootGame2",
    "__LeoBootGame3",
    # The rest of libultra's exception handler after __osException (exceptasm.s: send_mesg, handle_CpU,
    # __osEnqueueAndYield), which splat leaves unnamed: N64Recomp leaves the named parts out and the runtime has its own.
    "func_8009D24C_9DE4C",
]

# The survey (patches/survey.c): the overlay a script asked for, in place of the one the game goes to.
[[patches.hook]]
func = "omOvlGotoEx"
before_vram = 0x800771EC
text = "{ void mp_survey_goto(uint8_t*, gpr*, gpr*, gpr*); mp_survey_goto(rdram, &ctx->r4, &ctx->r5, &ctx->r6); }"

# The scissor func_8007CA0C_7D60C (Mario Party's pfDrawFonts) sets for the text it draws, and leaves set for what is
# drawn after it, reaches row 339 of a 240-line picture: (0, 0, 319, 339) in place of (0, 0, 319, 240). A board's
# objects that the camera has at the picture's bottom then draw past it, which on a console writes a few pixels into the
# next framebuffer's top rows, under the overscan border, but in RT64 makes the frame as tall as the scissor: RT64
# copies whole rows of it to RAM, over the top of the next framebuffer, takes that one's RAM as changed and draws it
# from RAM, so an old frame can flash up at 4:3 with black at its sides. Each of the function's two scissors is the
# whole screen's instead, (0, 0, 320, 240): it stops at the picture's bottom, and at 320, not 319, since RT64 draws a
# rectangle of the whole screen out to the window's edges only while it is as wide as every scissor in its framebuffer,
# and moves a rectangle's right edge onto its scissor's a pixel from it. The next frame's clear, under the text's 319,
# stayed inside 4:3, so the window's sides were never cleared, and a screen fading in built up there frame on frame over
# the last while the middle faded in from black: a minigame's explanation came in as a dark 4:3 box between sides
# already lit.
[[patches.hook]]
func = "func_8007CA0C_7D60C"
before_vram = 0x8007CA4C
text = "ctx->r2 = 0x005003C0;"

[[patches.hook]]
func = "func_8007CA0C_7D60C"
before_vram = 0x8007D014
text = "ctx->r2 = 0x005003C0;"

# The board's HUD at the picture's sides (lib/mario-party-engine/src/hud.cpp says how): the players' panels' places
# and groups (func_800600F8_60CF8(player, x, y) sets a panel's place, and D_80101510_102110, 0x48 bytes a player, has
# the panel's group at 0x8 and its xPos and yPos, the place the board moves it by, at 0x10), the groups killed
# (SprKill(group), and the sprite manager's init, func_8007F630_80230, which forgets them all; the groups' addresses
# are at 0x800FA1B0) and each sprite drawn (SprDisp(gfx, sprite), every path out of it through 0x800858E8 with gfx in
# s5), with its width on the screen: its frame's width (a u16 at 0x4 of its frame, 12 bytes each, from the frames its
# data at 0x84 points to, by its frame's index at 0x90) by its x scale (a float at 0x18), as SprDisp reads them.
[[patches.hook]]
func = "func_800600F8_60CF8"
before_vram = 0x800600F8
text = "{ void mp_hud_panel_at(uint8_t*, int32_t, gpr, int32_t, int32_t, gpr); int32_t p = (int32_t)ctx->r4; gpr s = (gpr)(int32_t)0x80101510 + p * 0x48; int16_t g = MEM_H(0x8, s); mp_hud_panel_at(rdram, p, (gpr)(int32_t)MEM_W(g * 4, (gpr)(int32_t)0x800FA1B0), 0xC, (int16_t)ctx->r5, s + 0x10); }"

[[patches.hook]]
func = "SprKill"
before_vram = 0x8007F8B0
text = "{ void mp_hud_group_killed(uint8_t*, gpr); mp_hud_group_killed(rdram, (gpr)(int32_t)MEM_W((int16_t)ctx->r4 * 4, (gpr)(int32_t)0x800FA1B0)); }"

[[patches.hook]]
func = "func_8007F630_80230"
before_vram = 0x8007F630
text = "{ void mp_hud_reset(uint8_t*); mp_hud_reset(rdram); }"

[[patches.hook]]
func = "SprDisp"
before_vram = 0x800849D4
text = "{ void mp_hud_sprite_width(uint8_t*, float); void mp_hud_sprite_start(uint8_t*, gpr, gpr); gpr s = ctx->r5; gpr data = (gpr)(int32_t)MEM_W(0x84, s); if (data != 0) { gpr frame = (gpr)(int32_t)MEM_W(0x0, data) + MEM_H(0x90, s) * 12; union { uint32_t u; float f; } scale; scale.u = (uint32_t)MEM_W(0x18, s); mp_hud_sprite_width(rdram, MEM_HU(0x4, frame) * scale.f); } mp_hud_sprite_start(rdram, ctx->r4, ctx->r5); }"

[[patches.hook]]
func = "SprDisp"
before_vram = 0x800858E8
text = "{ void mp_hud_sprite_end(uint8_t*, gpr); mp_hud_sprite_end(rdram, ctx->r21); }"

# The item a player uses carried out of their panel by their character's hand (hud.cpp, mp_hud_item_at and
# mp_hud_hand_read). func_800629AC_635AC(player, x, y) moves the item, member 2 of the panel's group, whose place is
# the floats at 0x48 of its sprite (SprPosSet's). Each board reads the hand's picture with DataRead(file), file 0x86
# plus the character (a byte at 0x800FD2C4, 0x34 bytes a player), and gives it to the hand's group next, with
# SprAnimSet(group, ...): only the hand of the player whose turn it is (a s16 at 0x800F93C6), whose item it is, is the
# panel's. A board's events at another player's panel read that player's hand, drawn with sprites of their own, and it
# stays as it is.
[[patches.hook]]
func = "func_800629AC_635AC"
before_vram = 0x800629AC
text = "{ void mp_hud_item_at(uint8_t*, int32_t, gpr, gpr); int32_t p = (int32_t)ctx->r4; if (p >= 0 && p < 4) { int16_t g = MEM_H(0x8, (gpr)(int32_t)0x80101510 + p * 0x48); gpr group = (gpr)(int32_t)MEM_W(g * 4, (gpr)(int32_t)0x800FA1B0); gpr s = (gpr)(int32_t)MEM_W(0xC + 2 * 4, group); mp_hud_item_at(rdram, p, s, s + 0x48); } }"

[[patches.hook]]
func = "DataRead"
before_vram = 0x80017680
text = "{ void mp_hud_hand_read(uint8_t*, int32_t); uint32_t file = (uint32_t)ctx->r4; int16_t p = MEM_H(0, (gpr)(int32_t)0x800F93C6); if (file >= 0x86 && file <= 0x8B && p >= 0 && p < 4 && MEM_BU(p * 0x34, (gpr)(int32_t)0x800FD2C4) == file - 0x86) mp_hud_hand_read(rdram, p); }"

[[patches.hook]]
func = "SprAnimSet"
before_vram = 0x8008218C
text = "{ void mp_hud_hand_group(uint8_t*, gpr); mp_hud_hand_group(rdram, (gpr)(int32_t)MEM_W((int16_t)ctx->r4 * 4, (gpr)(int32_t)0x800FA1B0)); }"

# A screen wipe past 4:3 (lib/mario-party-engine/src/wipe.cpp says how): the wipe module's whole-screen rectangle
# (func_8008F7F4_903F4(gfx, alpha), out through 0x8008F8C0), and a shape wipe's rectangles around its square
# (func_8009110C_91D0C, with gfx in t0, from 0x8009199C, where it has set their colour).
[[patches.hook]]
func = "func_8008F7F4_903F4"
before_vram = 0x8008F7F4
text = "{ void mp_wipe_fill_start(uint8_t*, gpr); mp_wipe_fill_start(rdram, ctx->r4); }"

[[patches.hook]]
func = "func_8008F7F4_903F4"
before_vram = 0x8008F8C0
text = "{ void mp_wipe_fill_end(uint8_t*, gpr); mp_wipe_fill_end(rdram, ctx->r4); }"

[[patches.hook]]
func = "func_8009110C_91D0C"
before_vram = 0x8009199C
text = "{ void mp_wipe_sides(uint8_t*, gpr); mp_wipe_sides(rdram, ctx->r8); }"

# A 4:3 picture's sides black (lib/mario-party-engine/src/wipe.cpp, mp_wipe_picture_sides): func_800286FC_292FC ends
# the frame's last display list after its wipe and its text, the list's next command in v0, with its gDPFullSync.
[[patches.hook]]
func = "func_800286FC_292FC"
before_vram = 0x800292CC
text = "{ gpr mp_wipe_picture_sides(uint8_t*, gpr); ctx->r2 = mp_wipe_picture_sides(rdram, ctx->r2); }"

# Bumper Balls' lava widened to a wide window's edges (patches/widescreen.c, widescreen_bumper_lava): the stage's frame
# function, with the stage's object in s0, each frame. The game's registers are kept around the call.
[[patches.hook]]
func = "func_80103430_211DD0_BumperBalls"
before_vram = 0x80103494
text = "{ void widescreen_bumper_lava(uint8_t*, recomp_context*); recomp_context saved = *ctx; ctx->r4 = ctx->r16; widescreen_bumper_lava(rdram, ctx); *ctx = saved; }"

# Board Movement and Map Scrolling (lib/mario-party-engine/src/board_options.cpp), Original by default.
# Fast board movement: func_80056E34_57A34(player, frames) takes a player to the next space in so many frames, 10 (a1)
# for a walk from func_800650F0_65CF0 and board 0x4C's func_801034C8_326888_name_4C (15 is a jump): 5.
[[patches.hook]]
func = "func_80056E34_57A34"
before_vram = 0x80056E34
text = "{ int mp_board_movement_fast(void); if ((int32_t)ctx->r5 == 10 && mp_board_movement_fast()) ctx->r5 = 5; }"

# Western Land's (0x3E) own moves at twice their speed, 4.0 for 2.0 (a3, to func_80056FD4_57BD4 and
# func_80057150_57D50), and the ring of 12 frames its func_801069C8_29BC98_name_3E counts at 0x801138B0 made 6.
[[patches.hook]]
func = "func_80106FE0_29C2B0_name_3E"
before_vram = 0x801071B8
text = "{ int mp_board_movement_fast(void); if (mp_board_movement_fast()) ctx->r7 = 0x40800000; }"

[[patches.hook]]
func = "func_80106FE0_29C2B0_name_3E"
before_vram = 0x801071D8
text = "{ int mp_board_movement_fast(void); if (mp_board_movement_fast()) ctx->r7 = 0x40800000; }"

[[patches.hook]]
func = "func_801069C8_29BC98_name_3E"
before_vram = 0x80106A5C
text = "{ int mp_board_movement_fast(void); if (mp_board_movement_fast()) ctx->r3 = (int32_t)MEM_W(0x38B0, (gpr)(int32_t)0x80110000) < 6; }"

# Space Land's (0x45) func_8011012C_2EE85C_name_45 at twice its speed (f20: 2.5, or 3.0 on its other path, both of
# which reach 0x801101A4).
[[patches.hook]]
func = "func_8011012C_2EE85C_name_45"
before_vram = 0x801101A4
text = "{ int mp_board_movement_fast(void); if (mp_board_movement_fast()) ctx->f20.fl *= 2.0f; }"

# Fast map scrolling: func_8006784C_6844C, the map's view, sets the board camera's speed (func_80053980_54580, f12) to
# 3.5 as it starts, which the camera follows the stick's target at: twice that.
[[patches.hook]]
func = "func_8006784C_6844C"
before_vram = 0x80067944
text = "{ int mp_map_scrolling_fast(void); if (mp_map_scrolling_fast()) ctx->f12.fl *= 2.0f; }"
