# N64Recomp's configuration for Mario Party 2 (USA), SHA-1 166eda1c05670d337e2c3f15a5db528ae1e5d6e3: it reads the game's
# code out of the ROM by the symbols tools/gen_syms.sh dumps from the decomp's ELF, and writes RecompiledFuncs/
# (tools/recompile.sh). The code is stored raw in the ROM: main after the boot code, and each of the 115 overlays
# (minigames, boards, menus) where marioparty2.yaml has it, so there is nothing to decompress first.
[input]
# The decomp's entrypoint (asm/entrypoint.s), the ROM header's.
entrypoint = 0x80000400
# Paths are relative to this file.
symbols_file_path = "syms/marioparty2.us.syms.toml"
rom_file_path = "roms/marioparty2.us.z64"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true

[patches]
# Functions recompiled as empty ones.
stubs = [
    # libleo's boot of a 64DD disk game, which the game links in and reaches only with a 64DD attached, which the
    # runtime never reports: the first writes to its stack at an offset N64Recomp can't analyze, the second sets
    # cop0's TagLo to clear the caches.
    "__LeoBootGame2",
    "__LeoBootGame3",
    # The rest of libultra's exception handler after __osException (exceptasm.s: send_mesg, handle_CpU,
    # __osEnqueueAndYield), which splat leaves unnamed: N64Recomp leaves the named parts out and the runtime has its own.
    "func_8009D24C_9DE4C",
]

# The survey (patches/survey.c): the overlay a script asked for, in place of the one the game goes to.
[[patches.hook]]
func = "omOvlGotoEx"
before_vram = 0x800771EC
text = "{ void mp_survey_goto(uint8_t*, gpr*, gpr*, gpr*); mp_survey_goto(rdram, &ctx->r4, &ctx->r5, &ctx->r6); }"

# The scissor func_8007CA0C_7D60C (Mario Party's pfDrawFonts) sets for the text it draws, and leaves set for what is
# drawn after it, reaches row 339 of a 240-line picture: (0, 0, 319, 339) in place of (0, 0, 319, 240). A board's
# objects that the camera has at the picture's bottom then draw past it, which on a console writes a few pixels into the
# next framebuffer's top rows, under the overscan border, but in RT64 makes the frame as tall as the scissor: RT64
# copies whole rows of it to RAM, over the top of the next framebuffer, takes that one's RAM as changed and draws it
# from RAM, so an old frame can flash up at 4:3 with black at its sides. Each of the function's two scissors is the
# whole screen's instead, (0, 0, 320, 240): it stops at the picture's bottom, and at 320, not 319, since RT64 draws a
# rectangle of the whole screen out to the window's edges only while it is as wide as every scissor in its framebuffer,
# and moves a rectangle's right edge onto its scissor's a pixel from it. The next frame's clear, under the text's 319,
# stayed inside 4:3, so the window's sides were never cleared, and a screen fading in built up there frame on frame over
# the last while the middle faded in from black: a minigame's explanation came in as a dark 4:3 box between sides
# already lit.
[[patches.hook]]
func = "func_8007CA0C_7D60C"
before_vram = 0x8007CA4C
text = "ctx->r2 = 0x005003C0;"

[[patches.hook]]
func = "func_8007CA0C_7D60C"
before_vram = 0x8007D014
text = "ctx->r2 = 0x005003C0;"

# The board's HUD at the picture's sides (lib/mario-party-engine/src/hud.cpp says how): the players' panels' places and
# groups (func_800600F8_60CF8(player, x, y) sets a panel's place, and D_80101510_102110, 0x48 bytes a player, has the
# panel's group at 0x8), the groups killed (SprKill(group), and the sprite manager's init, func_8007F630_80230, which
# forgets them all; the groups' addresses are at 0x800FA1B0) and each sprite drawn (SprDisp(gfx, sprite), every path
# out of it through 0x800858E8 with gfx in s5).
[[patches.hook]]
func = "func_800600F8_60CF8"
before_vram = 0x800600F8
text = "{ void mp_hud_panel(uint8_t*, int32_t, gpr, int32_t, int32_t); int32_t p = (int32_t)ctx->r4; int16_t g = MEM_H(0x8, (gpr)(int32_t)0x80101510 + p * 0x48); mp_hud_panel(rdram, p, (gpr)(int32_t)MEM_W(g * 4, (gpr)(int32_t)0x800FA1B0), 0xC, (int16_t)ctx->r5); }"

[[patches.hook]]
func = "SprKill"
before_vram = 0x8007F8B0
text = "{ void mp_hud_group_killed(uint8_t*, gpr); mp_hud_group_killed(rdram, (gpr)(int32_t)MEM_W((int16_t)ctx->r4 * 4, (gpr)(int32_t)0x800FA1B0)); }"

[[patches.hook]]
func = "func_8007F630_80230"
before_vram = 0x8007F630
text = "{ void mp_hud_reset(uint8_t*); mp_hud_reset(rdram); }"

[[patches.hook]]
func = "SprDisp"
before_vram = 0x800849D4
text = "{ void mp_hud_sprite_start(uint8_t*, gpr, gpr); mp_hud_sprite_start(rdram, ctx->r4, ctx->r5); }"

[[patches.hook]]
func = "SprDisp"
before_vram = 0x800858E8
text = "{ void mp_hud_sprite_end(uint8_t*, gpr); mp_hud_sprite_end(rdram, ctx->r21); }"

# A screen wipe past 4:3 (lib/mario-party-engine/src/wipe.cpp says how): the wipe module's whole-screen rectangle
# (func_8008F7F4_903F4(gfx, alpha), out through 0x8008F8C0), and a shape wipe's rectangles around its square
# (func_8009110C_91D0C, with gfx in t0, from 0x8009199C, where it has set their colour).
[[patches.hook]]
func = "func_8008F7F4_903F4"
before_vram = 0x8008F7F4
text = "{ void mp_wipe_fill_start(uint8_t*, gpr); mp_wipe_fill_start(rdram, ctx->r4); }"

[[patches.hook]]
func = "func_8008F7F4_903F4"
before_vram = 0x8008F8C0
text = "{ void mp_wipe_fill_end(uint8_t*, gpr); mp_wipe_fill_end(rdram, ctx->r4); }"

[[patches.hook]]
func = "func_8009110C_91D0C"
before_vram = 0x8009199C
text = "{ void mp_wipe_sides(uint8_t*, gpr); mp_wipe_sides(rdram, ctx->r8); }"
